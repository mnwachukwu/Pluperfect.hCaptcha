# Pluperfect.hCaptcha
#
# Two libraries in one repository: a .NET one taken by project reference, and an
# npm one taken by a file: dependency. Neither is a deployable, so there is no
# publish step and no artifact — what CI protects is the code itself.
#
# ⚠ CONSUMERS BUILD AGAINST WHATEVER IS ON THE DEFAULT BRANCH.
#
# The checkouts in the consuming repositories name no `ref:`, so a commit here is
# in every consumer's next build. That makes a green run on this repository the
# only thing standing between a change and every front end that asks a visitor to
# prove they are a person. Hence: every branch, every pull request, nothing
# skipped.
#
# workflow_dispatch runs the same thing on demand, which makes it a rehearsal
# before opening a pull request.

name: Build and test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ⚠ THE ACTION MAJORS BELOW ARE NOT UNIFORM, AND THAT IS DELIBERATE.
#
# GitHub deprecated Node 20 on the runners, so every action has to be on a major
# that declares `runs.using: node24`. The version at which each one crossed over
# is different, and they look like typos side by side:
#
#   checkout       v5    (v4 is node20)
#   setup-dotnet   v5    (v4 is node20)
#   setup-node     v6    (v4 is node20)
#
# So "bump everything to the same number" reintroduces the warning somewhere.
# Before changing any of these, check what the tag actually declares:
#
#   curl -s https://raw.githubusercontent.com/actions/checkout/v5/action.yml | grep using:

jobs:
  dotnet:
    name: .NET library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # global.json pins the SDK feature band, so the runner compiles with the
      # same one a developer does. Without this the runner picks whatever it has
      # preinstalled and an analyzer difference shows up as a mystery failure.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # --locked-mode fails rather than silently resolving a different version
      # than the one that was tested. It is also the check that a lock file was
      # committed alongside a dependency change.
      - run: dotnet restore --locked-mode

      # Warnings are errors in Directory.Build.props, so this step is also the
      # analyzer gate.
      - run: dotnet build -c Release --no-restore

      # Every test decides its case from configuration alone: no network, no
      # credential, no hCaptcha account. The registration rule is the whole
      # safety story of this library, and it is what these assert.
      - run: dotnet test -c Release --no-build

  client:
    name: Client package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # No cache key on package-lock.json here: this package has three dev
      # dependencies and nothing to gain from it.
      - run: npm ci

      # ⚠ THE BUILD IS THE PRODUCT.
      #
      # Consumers take this package by a file: dependency pointing at this
      # directory, and resolve `exports` to ./dist. dist/ is git-ignored, so a
      # consumer's CI builds it after checking this repository out beside its
      # own. If this step breaks, every front end that renders a contact form
      # fails to build — which is why it runs on every push rather than on a tag.
      - run: npm run build

      # That the build actually produced what package.json promises. A tsconfig
      # change that stops emitting declarations would otherwise surface as a
      # consumer's type errors rather than as a failure here.
      - name: Check the published entry points exist
        run: |
          set -euo pipefail
          for f in dist/index.js dist/index.d.ts; do
            test -f "$f" || { echo "missing $f, which package.json exports"; exit 1; }
          done
          echo "dist/index.js and dist/index.d.ts present"

      # react is a peerDependency and must stay one. Listing it as a real
      # dependency is the single most likely way to break every consumer at
      # once: a file: dependency is symlinked, so a second copy of React would
      # be resolved through this package's own node_modules and every hook in
      # the consuming application would throw.
      - name: Check react has not become a dependency
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').dependencies?.react ? 0 : 1)"; then
            echo "react is listed under dependencies; it must be a peerDependency"
            exit 1
          fi
          echo "react is not a runtime dependency"
